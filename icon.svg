<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="100%" stop-color="#0f0e0d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf0d9" />
      <stop offset="100%" stop-color="#e8dbbf" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Book Spine & Pages -->
  <g transform="translate(96, 120)">
    <!-- Left Book Page -->
    <path d="M 160,250 C 100,240 30,255 10,265 L 10,65 C 30,55 100,40 160,50 Z" fill="url(#pageGrad)" />
    <!-- Right Book Page -->
    <path d="M 160,250 C 220,240 290,255 310,265 L 310,65 C 290,55 220,40 160,50 Z" fill="#ffffff" />
    
    <!-- Spine binding -->
    <path d="M 160,45 L 160,255" stroke="#78350f" stroke-width="6" stroke-linecap="round" />
    
    <!-- Text Lines Left -->
    <line x1="40" y1="90" x2="130" y2="85" stroke="#a89a80" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="120" x2="130" y2="115" stroke="#a89a80" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="150" x2="130" y2="145" stroke="#a89a80" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="180" x2="110" y2="175" stroke="#a89a80" stroke-width="4" stroke-linecap="round" />
    
    <!-- Text Lines Right -->
    <line x1="190" y1="85" x2="280" y2="90" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="115" x2="280" y2="120" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="145" x2="280" y2="150" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="175" x2="260" y2="180" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    
    <!-- AI Sparkle Star -->
    <path d="M 160, -20 L 168, 10 L 198, 18 L 168, 26 L 160, 56 L 152, 26 L 122, 18 L 152, 10 Z" fill="url(#goldGrad)" />
    <!-- Small sparkles -->
    <path d="M 230, 20 L 234, 32 L 246, 36 L 234, 40 L 230, 52 L 226, 40 L 214, 36 L 226, 32 Z" fill="#fbbf24" />
  </g>
</svg>
